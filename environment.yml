# The conda half of an ommflow installation: the binary-heavy pieces that are
# not on PyPI, or that must match the machine's CPU.
#
# This file alone is NOT a complete install. The OpenFF stack is installed
# afterwards with pip --no-deps, because conda-forge's openff-toolkit drags in
# openff-nagl and its PyTorch stack, which ommflow never uses -- GAFF charges
# come from AmberTools AM1-BCC. Splitting it that way takes the environment
# from 234 packages to 165.
#
# Use install.sh, which does both halves:
#     bash install.sh
#
# Or by hand, then follow the pip steps in README.md:
#     conda env create -f environment.yml
#     conda activate ommflow
name: ommflow
channels:
  - conda-forge
dependencies:
  - python >=3.12
  # numpy 2.4 and later are built against an x86-64-v2 baseline and abort on
  # older HPC nodes with "NumPy was built with baseline optimizations (X86_V2)
  # but your machine doesn't support". 2.2.x keeps an SSE3 baseline, and the
  # cap also satisfies SciPy's and OpenFF's own numpy pins.
  - numpy <2.3
  # 8.5 is the first release with every force field and water model, complete.
  - openmm >=8.5
  # antechamber and sqm, for the AM1-BCC charges GAFF needs. Not on PyPI.
  - ambertools
  # Plots the dihedral restraint potential; only the Agg backend is used.
  - matplotlib-base >=3.7
  # Secondary structure assignment for --dihedral-restraint ss.
  - mdtraj >=1.9
  # Tests.
  - pytest >=7
