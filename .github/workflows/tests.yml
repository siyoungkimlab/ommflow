name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: pytest (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # OpenMM publishes PyPI wheels for these combinations. Its Linux
        # wheels need glibc >= 2.34, which ubuntu-latest provides; older
        # enterprise Linux has to install OpenMM from conda-forge instead.
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: Report the environment under test
        run: |
          python -c "import openmm; print('openmm', openmm.version.version)"
          python -c "from ommflow.lib.forcefields import installed_force_field_families as f; print('force fields', f())"
      - name: Run tests
        run: pytest tests -q

  docs:
    name: sphinx
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install -r docs/requirements.txt
      - name: Build docs as strictly as ReadTheDocs should
        run: python -m sphinx -b html -W docs docs/_build/html

  # One stable context for branch protection to require. Matrix job names
  # change whenever the matrix does; this one does not.
  all-checks:
    name: all checks
    if: always()
    needs: [tests, docs]
    runs-on: ubuntu-latest
    steps:
      - name: Verify every job succeeded
        run: |
          echo "tests: ${{ needs.tests.result }}"
          echo "docs:  ${{ needs.docs.result }}"
          [ "${{ needs.tests.result }}" = "success" ] \
            && [ "${{ needs.docs.result }}" = "success" ]
